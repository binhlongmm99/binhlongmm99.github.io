{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: Twemoji robot (CC-BY 4.0), transparent background -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=emoji1"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=emoji1"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=emoji1"/>
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png?v=emoji1"/>
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png?v=emoji1"/>
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=emoji1"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>
<script>
  // Keep browser chrome in sync with early theme choice
  (function () {
    try {
      if ((localStorage.getItem('theme') || 'light') === 'dark') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1115');
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
